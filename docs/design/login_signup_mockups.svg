<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="760" fill="#050505"/>
  <defs>
    <radialGradient id="g1" cx="50%" cy="25%" r="80%">
      <stop offset="0%" stop-color="#222"/>
      <stop offset="55%" stop-color="#080808"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0.1"/>
      <stop offset="0.55" stop-color="#000" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="blurGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <text x="600" y="60" text-anchor="middle" fill="#F2F2F5" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="5">SWINGLENS AI — AUTH DIRECTION</text>
  <text x="600" y="91" text-anchor="middle" fill="#74747D" font-family="Arial, sans-serif" font-size="13" letter-spacing="2">BLACK / WHITE · CINEMATIC · TECHNICAL · PREMIUM</text>

  <!-- Phone 1 -->
  <g transform="translate(210,125)">
